name: Signed release (manual)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to create, e.g. v0.1.0
        type: string
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Load private signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import os, base64, pathlib
          value=os.environ.get('ANDROID_KEYSTORE_BASE64')
          if not value:
              raise SystemExit('Configure the private release signing secrets first')
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'release.jks'
          p.write_bytes(base64.b64decode(value,validate=True))
          p.chmod(0o600)
          PY
      - name: Verify and build signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash gradlew --no-daemon --stacktrace :core:test :app:lintRelease :app:assembleRelease
      - name: Verify signature and checksum
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify android/app/build/outputs/apk/release/app-release.apk
          sha256sum android/app/build/outputs/apk/release/app-release.apk > android/app/build/outputs/apk/release/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/SHA256SUMS.txt
      - name: Remove temporary private key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
